name: Banner

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build-banner.mjs
      - .github/workflows/banner.yml

permissions:
  contents: write

concurrency: banner

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build banner.svg with the latest contribution stats
        run: node scripts/build-banner.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
      - name: Commit if the banner changed
        run: |
          git add banner.svg
          if git diff --cached --quiet; then
            echo "Banner unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "Refresh banner stats"
          git push --quiet
